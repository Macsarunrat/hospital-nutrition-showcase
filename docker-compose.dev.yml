version: '3.8'

# ==============================================================================
# Hospital Nutrition System — Local Development Environment
# ==============================================================================
# Focuses on developer velocity:
# 1. Hot reloading enabled via volume bind mounts
# 2. Direct port mappings for debugging (no Traefik required locally)
# 3. In-memory or relaxed settings for fast iterations
# ==============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dev_nutrition_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nutrition_dev
      - TZ=Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  django:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: dev_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend-django:/app/django
      - dev_media:/app/django/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nutrition_dev
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - FASTAPI_URL=http://fastapi:8001
      - INTERNAL_TOKEN=dev-internal-token
      - SECRET_KEY=dev-insecure-secret-key-for-local-testing-only
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db
      - redis

  fastapi:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: dev_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./backend-fastapi:/app
    ports:
      - "8001:8001"
    environment:
      - INTERNAL_TOKEN=dev-internal-token
    depends_on:
      - redis

  celery:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: dev_celery
    command: celery -A nutritionWebsite worker -l INFO --concurrency=1
    volumes:
      - ./backend-django:/app/django
      - dev_media:/app/django/media
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nutrition_dev
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - FASTAPI_URL=http://fastapi:8001
      - INTERNAL_TOKEN=dev-internal-token
      - SECRET_KEY=dev-insecure-secret-key-for-local-testing-only
    depends_on:
      - db
      - redis
      - django

volumes:
  dev_pgdata:
  dev_media:
