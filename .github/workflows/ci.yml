name: CI Pipeline (Integration & Quality Gate)

# Reference specification of the live production integration pipeline.
# Configured with workflow_dispatch so it serves as an architectural reference
# without automatically triggering against code-stripped showcase repos.
on:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Backend Integration & Migration Dry-Run Tests
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Migration Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Ephemeral CI Environment
        run: |
          cat << 'EOF' > .env
          POSTGRES_DB=ci_test_db
          POSTGRES_USER=ci_test_user
          POSTGRES_PASSWORD=ci_test_password
          SECRET_KEY=ci-ephemeral-secret-key-not-for-production
          INTERNAL_TOKEN=ci-ephemeral-internal-token
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          DEBUG=True
          ALLOWED_HOSTS=*
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          DOMAIN=localhost
          VITE_BASE_PATH=/
          STRIP_PREFIX=/
          TRUSTED_PROXIES=127.0.0.1
          EOF

      - name: Boot Containerized CI Stack
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env up -d --build
          # Wait briefly for database container healthcheck to settle
          sleep 10

      - name: Verify Database Migrations (Catch Uncommitted Schema Changes)
        run: |
          # Fails immediately if models were modified without running makemigrations
          docker exec django python manage.py makemigrations --check --dry-run
          # Verify migrations apply cleanly to a fresh database
          docker exec django python manage.py migrate

      - name: Execute Backend Automated Test Suite
        run: |
          docker exec django python manage.py test --noinput

      - name: Verify Seed & Fixture Loading
        run: |
          # Verifies sample mock data seeds properly without foreign key constraint violations
          docker exec django python seedmock.prod.py

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v

  # ----------------------------------------------------------------------------
  # Frontend Static Build Verification
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Dependencies & Verify Production Build
        working-directory: frontend-react
        run: |
          npm ci --legacy-peer-deps
          npm run build
